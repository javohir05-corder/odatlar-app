<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Odatlarim Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #161a21;
            --accent: #a3e635;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { width: 100%; text-align: left; margin-bottom: 25px; }
        .header h1 { font-size: 28px; margin: 0; font-weight: 700; }
        .header h1 span { color: var(--accent); }

        .input-group {
            width: 100%;
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 14px;
            color: white;
            outline: none;
            font-size: 16px;
        }

        .add-btn {
            background: var(--accent);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            color: #000;
            font-size: 16px;
        }

        .habits-list { width: 100%; display: flex; flex-direction: column; gap: 12px; }

        .habit-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1e293b;
            transition: 0.3s;
        }

        .habit-card.done {
            border-color: var(--accent);
            opacity: 0.6;
        }

        .habit-info { display: flex; align-items: center; gap: 12px; }

        .check-circle {
            width: 26px;
            height: 26px;
            border: 2px solid var(--text-dim);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .habit-card.done .check-circle {
            background: var(--accent);
            border-color: var(--accent);
        }

        .habit-card.done .check-circle i {
            color: black;
            font-size: 14px;
        }

        .habit-name { font-size: 17px; font-weight: 500; }
        .habit-card.done .habit-name { text-decoration: line-through; color: var(--text-dim); }

        .delete-btn { color: #ef4444; cursor: pointer; padding: 5px; font-size: 16px; }

        .stats {
            margin-top: 30px;
            color: var(--text-dim);
            font-size: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Odatlarim<span>.</span></h1>
        <p style="color: var(--text-dim); margin: 6px 0; font-size: 14px;">Bugungi intizom — ertangi muvaffaqiyat.</p>
    </div>

    <div class="input-group">
        <input type="text" id="habitInput" placeholder="Yangi odat (masalan: Sport bilan shug'ullanish)">
        <button class="add-btn" onclick="addHabit()">🟢</button>
    </div>

    <div class="habits-list" id="habitsList"></div>

    <div class="stats" id="statsText">0 ta odatdan 0 tasi bajarildi</div>

    <script>
        let habits = JSON.parse(localStorage.getItem('habits')) || [];
        const tg = window.Telegram.WebApp;
        tg.expand();

        function renderHabits() {
            const list = document.getElementById('habitsList');
            list.innerHTML = '';
            let doneCount = 0;

            habits.forEach((habit, index) => {
                if (habit.done) doneCount++;
                const card = document.createElement('div');
                card.className = `habit-card ${habit.done ? 'done' : ''}`;
                card.innerHTML = `
                    <div class="habit-info">
                        <div class="check-circle" onclick="toggleHabit(${index})">
                            ${habit.done ? '<i class="fa-solid fa-check"></i>' : ''}
                        </div>
                        <span class="habit-name">${habit.text}</span>
                    </div>
                    <i class="fa-solid fa-trash delete-btn" onclick="deleteHabit(${index})"></i>
                `;
                list.appendChild(card);
            });

            document.getElementById('statsText').innerText = `${habits.length} ta odatdan ${doneCount} tasi bajarildi`;
            localStorage.setItem('habits', JSON.stringify(habits));
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            if (input.value.trim() === '') return;
            habits.push({ text: input.value, done: false });
            input.value = '';
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            renderHabits();
        }

        function toggleHabit(index) {
            habits[index].done = !habits[index].done;
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            renderHabits();
        }

        function deleteHabit(index) {
            habits.splice(index, 1);
            renderHabits();
        }

        renderHabits();
    </script>
</body>
</html>
