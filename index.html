<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odatlarim Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #1c1c1e; color: #ffffff; padding: 20px; text-align: center; }
        .box { background-color: #2c2c2e; padding: 20px; border-radius: 12px; max-width: 350px; margin: 0 auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #3a3a3c; background: #3a3a3c; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007aff; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="box">
    <h2>🚀 Odatlarim Pro</h2>
    <input type="text" id="name" placeholder="Odat nomi (Masalan: Kitob o'qish)">
    <input type="time" id="time" value="08:00">
    <button onclick="save()">⏰ Odatni saqlash</button>
</div>
<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    function save() {
        const n = document.getElementById('name').value.trim();
        const t = document.getElementById('time').value;
        if(!n || !t) { alert("To'ldiring!"); return; }
        tg.sendData(n + ":" + t);
        tg.close();
    }
</script>
</body>
</html>
