<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odatlarim Pro - Premium Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: rgba(30, 30, 38, 0.7);
            --primary-color: #007aff;
            --primary-glow: #0a84ff;
            --success-color: #30d158;
            --text-main: #ffffff;
            --text-muted: #aeaeb2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Orqa fondagi neon effektlar */
        body::before {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--primary-color);
            filter: blur(100px);
            top: 10%;
            left: 10%;
            z-index: -1;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            border-radius: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 4px 0;
            background: linear-gradient(135deg, #fff 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Kategoriya Grid Tizimi */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .category-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .category-item:active {
            transform: scale(0.92);
        }

        .category-item.selected {
            background: rgba(0, 122, 255, 0.15);
            border-color: var(--primary-color);
            box-shadow: 0 0 12px rgba(0, 122, 255, 0.3);
        }

        .category-icon {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .category-name {
            font-size: 12px;
            font-weight: 500;
        }

        /* Input stillari */
        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="time"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 500;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.09);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }

        /* Hafta kunlari Multi-select */
        .days-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .day-badge {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            border: 1px solid transparent;
        }

        .day-badge.active {
            background: var(--text-main);
            color: var(--bg-color);
            font-weight: 700;
        }

        /* Premium Saqlash tugmasi */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #0056b3 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            transition: all 0.2s;
        }

        .btn-submit:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.2);
        }

        /* Muvaffaqiyatli Oyna */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .success-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .success-icon {
            font-size: 60px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Odatlarim Pro</h1>
        <p>Mukammal hayot sari kichik qadamlar</p>
    </div>

    <div class="section-title">Kategoriya</div>
    <div class="category-grid">
        <div class="category-item selected" onclick="selectCategory(this, '🏃‍♂️ Sport')">
            <div class="category-icon">🏃‍♂️</div>
            <div class="category-name">Sport</div>
        </div>
        <div class="category-item" onclick="selectCategory(this, '📚 Kitob')">
            <div class="category-icon">📚</div>
            <div class="category-name">Mutolaa</div>
        </div>
        <div class="category-item" onclick="selectCategory(this, '🍏 Sog\'liq')">
            <div class="category-icon">🍏</div>
            <div class="category-name">Sog'liq</div>
        </div>
        <div class="category-item" onclick="selectCategory(this, '💰 Moliya')">
            <div class="category-icon">💰</div>
            <div class="category-name">Moliya</div>
        </div>
        <div class="category-item" onclick="selectCategory(this, '😴 Uyqu')">
            <div class="category-icon">😴</div>
            <div class="category-name">Uyqu</div>
        </div>
        <div class="category-item" onclick="selectCategory(this, '🎯 Reja')">
            <div class="category-icon">🎯</div>
            <div class="category-name">Boshqa</div>
        </div>
    </div>

    <div class="section-title">Odat nomi</div>
    <div class="input-wrapper">
        <input type="text" id="habitName" placeholder="Masalan: Yugurish, Ingliz tili...">
    </div>

    <div class="section-title">Eslatma Vaqti</div>
    <div class="input-wrapper">
        <input type="time" id="habitTime" value="08:00">
    </div>

    <div class="section-title">Takrorlanish kunlari</div>
    <div class="days-row">
        <div class="day-badge active" onclick="toggleDay(this)">Du</div>
        <div class="day-badge active" onclick="toggleDay(this)">Se</div>
        <div class="day-badge active" onclick="toggleDay(this)">Cho</div>
        <div class="day-badge active" onclick="toggleDay(this)">Pa</div>
        <div class="day-badge active" onclick="toggleDay(this)">Ju</div>
        <div class="day-badge active" onclick="toggleDay(this)">Sha</div>
        <div class="day-badge active" onclick="toggleDay(this)">Ya</div>
    </div>

    <button class="btn-submit" onclick="saveHabitPro()">🚀 Tizimga Saqlash</button>
</div>

<div id="successScreen" class="success-overlay">
    <div class="success-icon">✨</div>
    <h2 style="margin-top: 16px;">Muvaffaqiyatli Saqlandi!</h2>
    <p style="color: var(--text-muted);">Odat bot tizimiga yuborildi.</p>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // Ranglarni Telegram mavzusiga moslash (Agarda foydalanuvchi xohlasa)
    document.documentElement.style.setProperty('--primary-color', tg.themeParams.button_color || '#007aff');

    let selectedCategoryStr = "🏃‍♂️ Sport";

    function selectCategory(element, catName) {
        document.querySelectorAll('.category-item').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        selectedCategoryStr = catName;
    }

    function toggleDay(element) {
        element.classList.toggle('active');
    }

    function saveHabitPro() {
        const textInput = document.getElementById('habitName').value.trim();
        const timeInput = document.getElementById('habitTime').value;

        if (!textInput) {
            tg.showAlert("Iltimos, odat nomini kiriting! 🛑");
            return;
        }

        // Faol kunlarni yig'amiz
        let activeDays = [];
        document.querySelectorAll('.day-badge.active').forEach(el => {
            activeDays.push(el.innerText);
        });

        // Ma'lumot formati: "Kategoriya OdatNomi:Soat:Daqiqa" -> Bot tushunadigan uzatish
        const finalHabitName = `[${selectedCategoryStr}] ${textInput}`;
        const dataToSend = `${finalHabitName}:${timeInput}`;

        // Haptik tebranish (Vibration) - Telefonda zo'r seziladi
        if (tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
        }

        // Animatsiyani yoqish
        document.getElementById('successScreen').classList.add('show');

        // Botga ma'lumot uzatish
        setTimeout(() => {
            tg.sendData(dataToSend);
            tg.close();
        }, 1200);
    }
</script>

</body>
</html>
